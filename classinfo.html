<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title></title>
  <link href="style.css" rel="stylesheet" />
  <script src="data.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-firestore.js"></script>
  <script src="firebase.js" defer></script>
  <script src="classinfo.js" defer></script>
</head>
<body>
  <header>
  <a href="classlist.html">Tárgyke listanézetben</a><a href="index.html">Tárgyek előmeneteli ábra nézetben</a>
  </header>
  <main>
    <div id="renderArea">
	  <p>Név: <span id="nev"></span></p>
	  <p>Típus: <span id="tipus"></span></p>
	  <p>Kredit: <span id="kredit"></span></p>
	  <p>Heti óraszám: <span id="orak"></span></p>
	  <p>Ajánlott félév: <span id="felev"></span> <span id="masodlagosFelev"></span></p>
	  <p>Előfeltételek: <span id="elofeltetel"></span></p>
	  <p>Tanárok: <span id="tanarok"></span></p>
	  <p>Felvétel típusa: <span id="kotelezo"></span></p>
	  <p>Leírás</p>
	  <div id="leiras"></div>
	  <div id="commentspace">
		<div id="submitComment">
		  <label for="rating">Értékelés</label>
		  <select id="rating">
		    <option value="1">Jó</option>
			<option value="0" selected>Nem értékelt</option>
			<option value="-1">Rossz</option>
		  </select><br>
		  <textarea id="commentText"></textarea><br>
		  <button id="submit" onclick="submitComment()">Rögzít</button>
		</div>
		<div id="listedComments"></div>
	  </div>
	</div>
  </main>
  
</body>
</html>
