<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title></title>
  <link href="style.css" rel="stylesheet" />

  <script src="data.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.22.1/firebase-firestore.js"></script>
  <script src="firebase.js" defer></script>
  <script src="classinfo.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Molekuláris Bionika Mérnöki BSc</div>
    <nav class="navlinks">
      <a href="classlist.html">Tárgyak listanézetben</a>
      <a href="index.html">Tárgyak előmeneteli ábra nézetben</a>
    </nav>
  </div>
</header>

<main class="content">

  <section id="renderArea" class="card">

    <h1 class="subject-title" id="nev"></h1>

    <div class="info-grid">
      <div><span class="label">Típus</span><span id="tipus"></span></div>
      <div><span class="label">Kredit</span><span id="kredit"></span></div>
      <div><span class="label">Heti óraszám</span><span id="orak"></span></div>
      <div><span class="label">Ajánlott félév</span>
        <span id="felev"></span> <span id="masodlagosFelev"></span>
      </div>
      <div><span class="label">Felvétel típusa</span><span id="kotelezo"></span></div>
      <div><span class="label">Tanárok</span><span id="tanarok"></span></div>
      <div class="wide">
        <span class="label">Előfeltételek</span>
        <span id="elofeltetel"></span>
      </div>
    </div>

    <section class="description">
      <h2>Leírás</h2>
      <div id="leiras"></div>
    </section>

    <section id="commentspace" class="comments">

      <div id="submitComment" class="comment-form">
        <h2>Értékelés hozzáadása</h2>

        <label for="rating">Értékelés</label>
        <select id="rating">
          <option value="1">Jó</option>
          <option value="0" selected>Nem értékelt</option>
          <option value="-1">Rossz</option>
        </select>

        <label for="commentText">Megjegyzés</label>
        <textarea id="commentText" rows="4"></textarea>

        <button id="submit" onclick="submitComment()">Rögzít</button>
      </div>

      <div id="listedComments" class="comment-list"></div>

    </section>

  </section>

</main>

</body>
</html>
